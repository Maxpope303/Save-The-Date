<style>
:root{
  --paper:#f7f5f0;
  --ink:#232120;
  --muted:#5e5a55;
  --rule:#d9d4cc;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:44px 16px 56px;text-align:center}

.label{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,12vw,76px);line-height:1;letter-spacing:.01em;margin:14px 0 32px}
h1 .amp{font-style:italic;font-weight:400;padding:0 .08em}

figure{margin:0}
img{display:block;width:100%;height:auto;filter:grayscale(1) contrast(1.02)}
.hero img{aspect-ratio:4/5;object-fit:cover;object-position:center 48%}

.when{margin:40px 0 0}
.date{font-family:var(--serif);font-weight:500;font-size:clamp(34px,8.4vw,52px);line-height:1.1;margin:0}
.time{font-family:var(--sans);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.place{font-family:var(--sans);font-size:14px;letter-spacing:.06em;line-height:1.7;color:var(--muted);margin:22px 0 0}
.place strong{display:block;font-weight:500;color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-size:13px}

.message{font-style:italic;font-size:clamp(21px,5vw,26px);line-height:1.45;max-width:420px;margin:36px auto 0}

.divider{width:48px;height:1px;background:var(--rule);border:0;margin:44px auto}

.second{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:center;text-align:left}

/* Flip card: beach photo on the front, venue on the back */
.flip{display:block;width:100%;perspective:1200px}
.card{position:relative;display:block;aspect-ratio:4/3;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.45,.05,.25,1)}
.flip.flipped .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face img{width:100%;height:100%;object-fit:cover;mix-blend-mode:normal}
.front img{object-position:center 30%}
.back{transform:rotateY(180deg)}
.back img{filter:none}

.second figcaption{margin:0}
.second .label{margin-bottom:12px}
.second .lead{font-style:italic;font-size:clamp(20px,4.6vw,26px);line-height:1.35;margin:0 0 12px}
.second .note{font-family:var(--sans);font-size:14px;line-height:1.7;color:var(--muted);margin:0}

.countdown{margin-top:44px}
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 0}
.counter>div{border-top:1px solid var(--rule);padding-top:12px}
.num{font-family:var(--serif);font-weight:500;font-size:clamp(28px,7vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.unit{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:12px 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:#000}

.signoff{font-style:italic;font-size:20px;color:var(--muted);margin:52px 0 0}

@media (max-width:420px){
  main{padding-top:32px}
  .actions{grid-template-columns:1fr}
  .counter{gap:6px}
  .second{gap:18px}
  .second .note{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  .btn{transition:none}
  /* Swap faces with a fade instead of a spin */
  .card{transition:none;transform:none!important}
  .face{transition:opacity 1s;transform:none}
  .back{opacity:0}
  .flip.flipped .front{opacity:0}
  .flip.flipped .back{opacity:1}
}
</style>

    <div class="counter">

<script>
(function(){
  // 2:00 pm BST on 25 June 2027 = 13:00 UTC
  var target=Date.UTC(2027,5,25,13,0,0);
  var els=['days','hours','minutes','seconds'].map(function(id){return document.getElementById(id);});
  var timer=null;

  // Turn the card over every few seconds, pausing while the page is in the background
  var flip=document.getElementById('flip'), flipTimer=null;
  function startFlip(){if(!flipTimer)flipTimer=setInterval(function(){flip.classList.toggle('flipped');},4500);}
  function stopFlip(){clearInterval(flipTimer);flipTimer=null;}
  startFlip();
  document.addEventListener('visibilitychange',function(){document.hidden?stopFlip():startFlip();});
  function render(v){els.forEach(function(el,i){el.textContent=String(v[i]).padStart(2,'0');});}
  function update(){
    var remaining=target-Date.now();
    if(remaining<=0){render([0,0,0,0]);if(timer){clearInterval(timer);timer=null;}return;}
    var t=Math.floor(remaining/1000);
    render([Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60]);
  }
  update();
  timer=setInterval(update,1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)update();});

  var title='Max & Elise’s Wedding';
  var place='Woodditton, Newmarket, Cambridgeshire, England';
  var details='We’re so excited to celebrate our wedding day with you! A formal invitation will follow.';

  // Google Calendar
  document.getElementById('gcal').href='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(title)
    +'&dates=20270625T130000Z/20270625T230000Z'
    +'&location='+encodeURIComponent(place)
    +'&details='+encodeURIComponent(details);

  // Apple Calendar / Outlook (.ics download)
  function stamp(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
  function esc(s){return s.replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;');}
  document.getElementById('calendar').addEventListener('click',function(){
    var lines=[
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Max and Elise//Save the Date//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:wedding-max-elise-20270625@save-the-date',
      'DTSTAMP:'+stamp(new Date()),
      'DTSTART:20270625T130000Z',
      'DTEND:20270625T230000Z',
      'SUMMARY:'+esc(title),
      'LOCATION:'+esc(place),
      'DESCRIPTION:'+esc(details),
      'END:VEVENT','END:VCALENDAR'];
    var blob=new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='Max-and-Elise-Wedding-25-June-2027.ics';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  });
})();
</script>
